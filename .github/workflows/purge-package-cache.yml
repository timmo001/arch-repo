---
name: Purge package cache

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      package-filename:
        description: Exact package filename to purge with its signature
        required: true
        type: string

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate package filename
        env:
          PACKAGE_FILENAME: ${{ inputs.package-filename }}
        run: |
          [[ "$PACKAGE_FILENAME" =~ ^[A-Za-z0-9@._+:-]+\.pkg\.tar\.zst$ ]]
      - name: Purge package and signature URLs
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/cloudflare-purge-cache@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0
        with:
          zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          api-token: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          files: |
            https://packages.timmo.dev/x86_64/${{ inputs.package-filename }}
            https://packages.timmo.dev/x86_64/${{ inputs.package-filename }}.sig
