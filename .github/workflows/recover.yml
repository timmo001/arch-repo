---
name: Recover repository

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Signed recovery manifest to publish
        required: true
        default: previous
        type: choice
        options:
          - previous
          - current

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download repository state
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: sync
          direction: down
          local-path: state/
          remote-path: x86_64/
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Prepare signed recovery state
        env:
          ARCH_REPO_SIGNING_KEY: ${{ github.workspace }}/.work/signing-key.asc
          ARCH_REPO_SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_SIGNING_PASSPHRASE }}
          MANIFEST: ${{ inputs.manifest }}
          SIGNING_KEY: ${{ secrets.ARCH_REPO_SIGNING_KEY }}
        run: |
          mkdir -p .work state
          printf '%s\n' "$SIGNING_KEY" > "$ARCH_REPO_SIGNING_KEY"
          chmod 0600 "$ARCH_REPO_SIGNING_KEY"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repository" \
            --workdir /repository \
            --env ARCH_REPO_CANDIDATE_DIR=/repository/candidate-packages \
            --env ARCH_REPO_STATE_DIR=/repository/state \
            --env ARCH_REPO_OUTPUT_DIR=/repository/output \
            --env ARCH_REPO_SIGNING_PASSPHRASE \
            --env ARCH_REPO_SIGNING_KEY=/repository/.work/signing-key.asc \
            --env GITHUB_RUN_ID \
            --env MANIFEST \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed gnupg jq pacman-contrib
              bash scripts/recover.sh "$MANIFEST"
              chown -R '"$(id -u):$(id -g)"' output
            '
          rm -f "$ARCH_REPO_SIGNING_KEY"
      - name: Upload verified package objects
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: cp
          recursive: "true"
          local-path: output/
          remote-path: x86_64/
          filters: |
            exclude *
            include *.pkg.tar.zst
            include *.pkg.tar.zst.sig
          cache-control: public, max-age=31536000, immutable
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Upload current recovery manifest
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: cp
          recursive: "true"
          local-path: output/recovery/
          remote-path: x86_64/recovery/
          filters: |
            exclude *
            include current.json
            include current.json.sig
          cache-control: public, max-age=60, s-maxage=300, must-revalidate
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      # One step per file keeps the database last, after what it lists
      - name: Upload timmo.files.tar.zst
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: cp
          local-path: output/timmo.files.tar.zst
          remote-path: x86_64/timmo.files.tar.zst
          cache-control: public, max-age=60, s-maxage=300, must-revalidate
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Upload timmo.files
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: cp
          local-path: output/timmo.files
          remote-path: x86_64/timmo.files
          cache-control: public, max-age=60, s-maxage=300, must-revalidate
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Upload timmo.db.tar.zst
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: cp
          local-path: output/timmo.db.tar.zst
          remote-path: x86_64/timmo.db.tar.zst
          cache-control: public, max-age=60, s-maxage=300, must-revalidate
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Upload timmo.db
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: cp
          local-path: output/timmo.db
          remote-path: x86_64/timmo.db
          cache-control: public, max-age=60, s-maxage=300, must-revalidate
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Purge mutable repository URLs
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/cloudflare-purge-cache@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          api-token: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          files: |
            https://packages.timmo.dev/x86_64/timmo.db
            https://packages.timmo.dev/x86_64/timmo.db.tar.zst
            https://packages.timmo.dev/x86_64/timmo.files
            https://packages.timmo.dev/x86_64/timmo.files.tar.zst
            https://packages.timmo.dev/x86_64/recovery/current.json
            https://packages.timmo.dev/x86_64/recovery/current.json.sig
      - name: Verify public repository
        run: bash scripts/health-check.sh
