---
name: Publish package
# yamllint disable rule:line-length
run-name: >-
  Publish ${{ github.event.client_payload.package || github.event.client_payload.artifact_name || inputs.artifact-name }}
# yamllint enable rule:line-length

# yamllint disable-line rule:truthy
on:
  repository_dispatch:
    types: [publish-package]
  workflow_dispatch:
    inputs:
      source-repository:
        description: Allowlisted source repository
        required: true
        type: string
      source-sha:
        description: Exact source commit SHA
        required: true
        type: string
      source-run-id:
        description: Source workflow run containing the candidate artifact
        required: true
        type: string
      artifact-name:
        description: Validated candidate artifact name
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for earlier publishes
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          while [[ $(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/runs" \
            --field per_page=100 \
            --jq "any(.workflow_runs[]; .id < ($RUN_ID | tonumber) and \
              (.status == \"queued\" or .status == \"in_progress\"))") \
            == true ]]; do
            echo "Waiting for an earlier publish"
            sleep 15
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate dispatch contract
        id: contract
        env:
          ARTIFACT_NAME: ${{ github.event.client_payload.artifact_name || inputs.artifact-name }}
          GH_TOKEN: ${{ secrets.SOURCE_ARTIFACT_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.source-repository }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id || inputs.source-run-id }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha || inputs.source-sha }}
        run: |
          [[ "$SOURCE_REPOSITORY" =~ ^timmo001/[A-Za-z0-9._-]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          jq -e --arg repository "$SOURCE_REPOSITORY" \
            'any(.packages[]; .repository == $repository)' \
            config/packages.json
          actual_sha="$(gh api --method GET \
            "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            --jq .head_sha)"
          [[ "$actual_sha" == "$SOURCE_SHA" ]] || {
            echo "Source run SHA does not match dispatch SHA" >&2
            exit 1
          }
          {
            echo "artifact_name=$ARTIFACT_NAME"
            echo "source_repository=$SOURCE_REPOSITORY"
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Download validated candidate
        env:
          GH_TOKEN: ${{ secrets.SOURCE_ARTIFACT_TOKEN }}
        run: |
          gh run download "${{ steps.contract.outputs.source_run_id }}" \
            --repo "${{ steps.contract.outputs.source_repository }}" \
            --name "${{ steps.contract.outputs.artifact_name }}" \
            --dir candidate-artifact
      - name: Validate candidate contents
        id: candidate
        run: |
          envelope=candidate-artifact/candidate.tar
          unexpected="$(find candidate-artifact -mindepth 1 -maxdepth 1 \
            \( ! -type f -o ! -name 'candidate.tar' \) -print -quit)"
          [[ -z "$unexpected" && -f "$envelope" ]] || {
            echo "Candidate artifact must contain only candidate.tar" >&2
            exit 1
          }
          [[ "$(dd if="$envelope" bs=1 skip=257 count=5 status=none)" == ustar ]] || {
            echo "Candidate envelope must be an uncompressed tar archive" >&2
            exit 1
          }

          mapfile -t members < <(tar --list --file "$envelope" \
            --quoting-style=escape)
          (( ${#members[@]} == 2 )) || {
            echo "Candidate envelope must contain exactly two entries" >&2
            exit 1
          }
          package_name=
          provenance_found=false
          for member in "${members[@]}"; do
            [[ "$member" != /* && "$member" != .. && \
              "$member" != ../* && "$member" != */../* && \
              "$member" != */.. ]] || {
              echo "Candidate envelope contains an unsafe path: $member" >&2
              exit 1
            }
            if [[ "$member" == provenance.json ]]; then
              [[ "$provenance_found" == false ]] || exit 1
              provenance_found=true
            elif [[ "$member" =~ ^[A-Za-z0-9@._+:~-]+\.pkg\.tar\.zst$ ]]; then
              [[ -z "$package_name" ]] || exit 1
              package_name="$member"
            else
              echo "Candidate envelope contains an unexpected entry: $member" >&2
              exit 1
            fi
          done
          [[ -n "$package_name" && "$provenance_found" == true ]] || {
            echo "Candidate envelope must contain one package and provenance.json" >&2
            exit 1
          }
          while IFS= read -r entry; do
            [[ "$entry" == -* ]] || {
              echo "Candidate envelope entries must be regular files" >&2
              exit 1
            }
          done < <(tar --list --verbose --file "$envelope" \
            --quoting-style=escape)

          mkdir -p candidate
          tar --extract --file "$envelope" --directory candidate \
            --no-same-owner --no-same-permissions
          [[ -f "candidate/$package_name" && \
            ! -L "candidate/$package_name" && \
            -f candidate/provenance.json && \
            ! -L candidate/provenance.json ]] || {
            echo "Candidate envelope did not extract to the validated files" >&2
            exit 1
          }
          jq -e \
            --slurpfile config config/packages.json \
            --arg artifact "$package_name" \
            --arg repository "${{ steps.contract.outputs.source_repository }}" \
            --arg sha "${{ steps.contract.outputs.source_sha }}" \
            '.artifact == $artifact and
              ($config[0].packages[.package].repository == $repository) and
              .source_repository == $repository and
              .source_sha == $sha' \
            candidate/provenance.json >/dev/null
          mkdir -p candidate-packages
          cp -- "candidate/$package_name" candidate-packages/
          {
            echo "file=$package_name"
            echo "package=$(jq -r .package candidate/provenance.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Start source deployment
        id: deployment
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/arch-source-deployment@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        env:
          GH_TOKEN: ${{ secrets.SOURCE_ARTIFACT_TOKEN }}
        with:
          stage: start
          sourceRepository: ${{ steps.contract.outputs.source_repository }}
          sourceSha: ${{ steps.contract.outputs.source_sha }}
          packageName: ${{ steps.candidate.outputs.package }}
          packageFile: ${{ steps.candidate.outputs.file }}
      - name: Download current repository state
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: sync
          direction: down
          local-path: state/
          remote-path: x86_64/
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Prepare signed repository state
        env:
          ARCH_REPO_SIGNING_KEY: ${{ github.workspace }}/.work/signing-key.asc
          ARCH_REPO_SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_SIGNING_PASSPHRASE }}
          ARCH_REPO_CANDIDATE_DIR: ${{ github.workspace }}/candidate-packages
          ARCH_REPO_STATE_DIR: ${{ github.workspace }}/state
          ARCH_REPO_OUTPUT_DIR: ${{ github.workspace }}/output
          ARCH_REPO_EXPECTED_SOURCE_REPOSITORY: ${{ steps.contract.outputs.source_repository }}
          ARCH_REPO_SOURCE_SHA: ${{ steps.contract.outputs.source_sha }}
          SIGNING_KEY: ${{ secrets.ARCH_REPO_SIGNING_KEY }}
        run: |
          mkdir -p .work state
          printf '%s\n' "$SIGNING_KEY" > "$ARCH_REPO_SIGNING_KEY"
          chmod 0600 "$ARCH_REPO_SIGNING_KEY"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repository" \
            --workdir /repository \
            --env ARCH_REPO_CANDIDATE_DIR=/repository/candidate-packages \
            --env ARCH_REPO_STATE_DIR=/repository/state \
            --env ARCH_REPO_OUTPUT_DIR=/repository/output \
            --env ARCH_REPO_EXPECTED_SOURCE_REPOSITORY \
            --env ARCH_REPO_SOURCE_SHA \
            --env ARCH_REPO_SIGNING_PASSPHRASE \
            --env ARCH_REPO_SIGNING_KEY=/repository/.work/signing-key.asc \
            --env GITHUB_RUN_ID \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed gnupg jq pacman-contrib
              bash scripts/publish.sh
              chown -R '"$(id -u):$(id -g)"' output
            '
          rm -f "$ARCH_REPO_SIGNING_KEY"
      # Package filenames have no glob characters, so each include matches one
      # object, and "exclude *" alone matches none
      - name: Select package objects to upload and prune
        id: objects
        run: |
          shopt -s nullglob
          {
            echo 'upload<<EOF'
            echo 'exclude *'
            for file in output/*.pkg.tar.zst output/*.pkg.tar.zst.sig; do
              # Packages carried over from the current state are already stored.
              [[ -e "state/${file##*/}" ]] && continue
              echo "include ${file##*/}"
            done
            echo EOF
            echo 'prune<<EOF'
            echo 'exclude *'
            for file in state/*.pkg.tar.zst state/*.pkg.tar.zst.sig; do
              [[ -e "output/${file##*/}" ]] && continue
              echo "include ${file##*/}"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Upload immutable packages first
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: cp
          recursive: "true"
          local-path: output/
          remote-path: x86_64/
          filters: ${{ steps.objects.outputs.upload }}
          cache-control: public, max-age=31536000, immutable
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Upload recovery manifests
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: cp
          recursive: "true"
          local-path: output/recovery/
          remote-path: x86_64/recovery/
          cache-control: public, max-age=60, s-maxage=300, must-revalidate
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      # One step per file keeps the database last, after what it lists
      - name: Upload timmo.files.tar.zst
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: cp
          local-path: output/timmo.files.tar.zst
          remote-path: x86_64/timmo.files.tar.zst
          cache-control: public, max-age=60, s-maxage=300, must-revalidate
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Upload timmo.files
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: cp
          local-path: output/timmo.files
          remote-path: x86_64/timmo.files
          cache-control: public, max-age=60, s-maxage=300, must-revalidate
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Upload timmo.db.tar.zst
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: cp
          local-path: output/timmo.db.tar.zst
          remote-path: x86_64/timmo.db.tar.zst
          cache-control: public, max-age=60, s-maxage=300, must-revalidate
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Upload timmo.db
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: cp
          local-path: output/timmo.db
          remote-path: x86_64/timmo.db
          cache-control: public, max-age=60, s-maxage=300, must-revalidate
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Purge mutable repository URLs
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/cloudflare-purge-cache@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          api-token: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          files: |
            https://packages.timmo.dev/x86_64/timmo.db
            https://packages.timmo.dev/x86_64/timmo.db.tar.zst
            https://packages.timmo.dev/x86_64/timmo.files
            https://packages.timmo.dev/x86_64/timmo.files.tar.zst
            https://packages.timmo.dev/x86_64/recovery/current.json
            https://packages.timmo.dev/x86_64/recovery/current.json.sig
            https://packages.timmo.dev/x86_64/recovery/previous.json
            https://packages.timmo.dev/x86_64/recovery/previous.json.sig
      - name: Verify public repository
        run: bash scripts/health-check.sh
      - name: Prune superseded package objects
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/r2-objects@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        with:
          command: rm
          recursive: "true"
          remote-path: x86_64/
          filters: ${{ steps.objects.outputs.prune }}
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
      - name: Finish source deployment
        if: always() && steps.deployment.outputs.deployment-id != ''
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/arch-source-deployment@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
        env:
          GH_TOKEN: ${{ secrets.SOURCE_ARTIFACT_TOKEN }}
        with:
          stage: finish
          sourceRepository: ${{ steps.contract.outputs.source_repository }}
          deploymentId: ${{ steps.deployment.outputs.deployment-id }}
          environmentUrl: ${{ steps.deployment.outputs.environment-url }}
          jobStatus: ${{ job.status }}
