---
name: Recover repository

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Signed recovery manifest to publish
        required: true
        default: previous
        type: choice
        options:
          - previous
          - current

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Install R2 client
        run: pipx install awscli==1.45.63
      - name: Download repository state
        env: &r2
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p state
          aws s3 sync "s3://$R2_BUCKET/x86_64/" state/ \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --no-progress
      - name: Prepare signed recovery state
        env:
          ARCH_REPO_SIGNING_KEY: ${{ github.workspace }}/.work/signing-key.asc
          ARCH_REPO_SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_SIGNING_PASSPHRASE }}
          MANIFEST: ${{ inputs.manifest }}
          SIGNING_KEY: ${{ secrets.ARCH_REPO_SIGNING_KEY }}
        run: |
          mkdir -p .work
          printf '%s\n' "$SIGNING_KEY" > "$ARCH_REPO_SIGNING_KEY"
          chmod 0600 "$ARCH_REPO_SIGNING_KEY"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repository" \
            --workdir /repository \
            --env ARCH_REPO_CANDIDATE_DIR=/repository/candidate-packages \
            --env ARCH_REPO_STATE_DIR=/repository/state \
            --env ARCH_REPO_OUTPUT_DIR=/repository/output \
            --env ARCH_REPO_SIGNING_PASSPHRASE \
            --env ARCH_REPO_SIGNING_KEY=/repository/.work/signing-key.asc \
            --env GITHUB_RUN_ID \
            --env MANIFEST \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed gnupg jq pacman-contrib
              bash scripts/recover.sh "$MANIFEST"
              chown -R '"$(id -u):$(id -g)"' output
            '
          rm -f "$ARCH_REPO_SIGNING_KEY"
      - name: Upload verified package objects
        env: *r2
        run: |
          for file in output/*.pkg.tar.zst output/*.pkg.tar.zst.sig; do
            aws s3 cp "$file" "s3://$R2_BUCKET/x86_64/${file##*/}" \
              --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress
          done
      - name: Upload current recovery manifest
        env: *r2
        run: |
          for file in output/recovery/current.json output/recovery/current.json.sig; do
            aws s3 cp "$file" "s3://$R2_BUCKET/x86_64/recovery/${file##*/}" \
              --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --cache-control "public, max-age=60, s-maxage=300, must-revalidate" \
              --no-progress
          done
      - name: Upload repository database last
        env: *r2
        run: |
          for file in output/timmo.files.tar.zst output/timmo.files output/timmo.db.tar.zst output/timmo.db; do
            aws s3 cp "$file" "s3://$R2_BUCKET/x86_64/${file##*/}" \
              --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --cache-control "public, max-age=60, s-maxage=300, must-revalidate" \
              --no-progress
          done
      - name: Purge mutable repository URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"files":[
              "https://packages.timmo.dev/x86_64/timmo.db",
              "https://packages.timmo.dev/x86_64/timmo.db.tar.zst",
              "https://packages.timmo.dev/x86_64/timmo.files",
              "https://packages.timmo.dev/x86_64/timmo.files.tar.zst",
              "https://packages.timmo.dev/x86_64/recovery/current.json",
              "https://packages.timmo.dev/x86_64/recovery/current.json.sig"
            ]}' \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache")"
          jq -e '.success == true' <<< "$response" >/dev/null
      - name: Verify public repository
        run: bash scripts/health-check.sh
