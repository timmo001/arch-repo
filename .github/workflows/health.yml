---
name: Repository health

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check public repository
        run: bash scripts/health-check.sh
